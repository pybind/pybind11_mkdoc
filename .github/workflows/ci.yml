name: CI

on:
  pull_request:
  push:
    branches:
    - master
    tags:
    - 'v*'

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@v9.0.0
    - run: uvx prek run -a --show-diff-on-failure

  checks:
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - "3.9"
        - "3.12"
        - "3.14"
        - "3.15"
        runs-on:
        - ubuntu-latest
        - macos-15-intel
    runs-on: ${{ matrix.runs-on }}
    name: Test • 🐍 ${{ matrix.python-version }} • ${{matrix.runs-on}}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - uses: astral-sh/setup-uv@v9.0.0

    - name: Test package
      run: uv run --with "clang<19" --group test pytest

  checks_windows:
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - "3.9"
        - "3.14"
    runs-on: windows-latest
    name: Test • 🐍 ${{ matrix.python-version }} • windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
    - uses: astral-sh/setup-uv@v9.0.0

    - name: Test package
      env:
        LIBCLANG_PATH: C:\Program Files\LLVM\bin\libclang.dll
      run: uv run --with "clang<19" --group test pytest


  dist:
    runs-on: ubuntu-latest
    name: Build distribution
    steps:
    - uses: actions/checkout@v7
    - uses: hynek/build-and-inspect-python-package@v3.0.1
